<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>

    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>

    <header>
        <h1>QuickNotes</h1>
        <p><u>Capture ideas before they disappear.</u></p>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Notes Manager</h2>

            <button id="load-btn" type="button">
                Load Notes
            </button>

            <p id="status">
                Ready to load notes.
            </p>
        </section>

        <section>
            <h2>Add a Note</h2>

            <form id="note-form">
                <div>
                    <label for="title-input">Title</label>
                 <input
                    type="text"
                    id="title-input"
                    name="title"
                    maxlength="100"
                    required
                    >
                </div>

                <div>
                    <label for="body-input">Note Content</label>
                    <textarea
                        id="body-input"
                        name="body"
                        rows="5"
                        placeholder="Write your note here..."
                        
                    ></textarea>
                </div>

                <button id="submit-btn" type="submit">
                    Save Note
                </button>
            </form>
        </section>

        <section>
            <h2>Your Notes</h2>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>

</body>
</html>
